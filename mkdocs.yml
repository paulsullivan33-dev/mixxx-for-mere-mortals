site_name: Mixxx for Mere Mortals
site_description: Free DJ software that plays your music files on virtual decks with a real mixer and a measured library. Installing Mixxx, scanning and analysing a collection, what its BPM and key numbers are worth, Auto DJ, broadcasting and controllers, with the limits stated plainly.
